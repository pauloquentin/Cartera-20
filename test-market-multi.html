<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CARTERA 20 · Proveedor múltiple</title>
  <style>
    :root{background:#111a24;color:#edf2f7;font-family:Arial,sans-serif}
    body{margin:0;padding:24px;max-width:760px;margin-inline:auto;background:#111a24}
    h1{font-size:30px;margin:0 0 8px}.sub{color:#9fb0c3;margin-bottom:22px}
    .card{background:#1d2a38;border-radius:20px;padding:20px;margin:14px 0}
    button{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:#71d6a0;color:#102018;cursor:pointer;margin:4px}
    .status{margin-top:14px;color:#9fb0c3}.ok{color:#71d6a0}.err{color:#ff9b9b}
    .row{display:flex;justify-content:space-between;border-top:1px solid #334352;padding:11px 0;gap:20px}
    .label{color:#a9b7c6}.value{text-align:right;font-weight:700}
  </style>
</head>
<body>
  <h1>Proveedor múltiple</h1>
  <div class="sub">CARTERA 20 · una fuente, múltiples tickers</div>

  <div class="card">
    <strong>Google Sheets / Google Finance</strong>
    <p class="sub">El motor consulta la pestaña correspondiente al ticker. Agregar un activo futuro no requiere duplicar el proveedor.</p>
    <button data-ticker="SPY">Probar SPY</button>
    <button data-ticker="BRKB">Probar BRKB</button>
    <button data-ticker="VEA">Probar VEA</button>
    <button data-ticker="O">Probar O</button>
    <div id="status" class="status">Esperando una prueba…</div>
  </div>

  <div id="result" class="card" hidden></div>

  <script src="market-data.js"></script>
  <script>
    const SHEET_ID = '1oVR-CTWE5VmIoy1ly_fJrcrT6ZgtJLllUQBp6iGarv4';
    const proveedor = Cartera20MarketData.crearProveedorGoogleSheets({
      spreadsheetId: SHEET_ID,
      sheetByTicker: {
        SPY: 'SPY',
        BRKB: 'BRKB',
        VEA: 'VEA',
        O: 'O'
      }
    });

    const status = document.getElementById('status');
    const result = document.getElementById('result');

    function fechaVisible(value){
      if (!value) return '—';
      const match = String(value).match(/Date\((\d+),(\d+),(\d+)(?:,\d+,\d+)?\)/);
      if (match) return `${match[3].padStart(2,'0')}/${String(Number(match[2])+1).padStart(2,'0')}/${match[1]}`;
      const d = new Date(value);
      return Number.isNaN(d.getTime()) ? value : d.toLocaleDateString('es-AR');
    }

    async function probar(ticker){
      status.className = 'status';
      status.textContent = `Consultando ${ticker}…`;
      result.hidden = true;
      try {
        const history = await proveedor.getHistory(ticker);
        const quote = await proveedor.getQuote(ticker);
        const rsi = Cartera20MarketData.calcularRSI(history.data);
        const first = history.data[0];
        const last = history.data[history.data.length - 1];

        result.innerHTML = `
          <h2>${ticker} · OK</h2>
          <div class="row"><span class="label">Cierres</span><span class="value">${history.data.length}</span></div>
          <div class="row"><span class="label">Variaciones</span><span class="value">${rsi.periods}</span></div>
          <div class="row"><span class="label">Primer cierre</span><span class="value">${fechaVisible(first.date)} · ${first.close.toLocaleString('es-AR')}</span></div>
          <div class="row"><span class="label">Último cierre</span><span class="value">${fechaVisible(last.date)} · ${quote.price.toLocaleString('es-AR')}</span></div>
          <div class="row"><span class="label">RSI-14</span><span class="value ok">${rsi.value === null ? 'Sin datos suficientes' : rsi.value.toFixed(2)}</span></div>
          <div class="row"><span class="label">Fuente</span><span class="value">${quote.source}</span></div>
        `;
        result.hidden = false;
        status.className = 'status ok';
        status.textContent = `${ticker}: conexión, histórico y cálculo validados.`;
      } catch (error) {
        status.className = 'status err';
        status.textContent = `Error en ${ticker}: ${error.message}`;
      }
    }

    document.querySelectorAll('button[data-ticker]').forEach(button => {
      button.addEventListener('click', () => probar(button.dataset.ticker));
    });
  </script>
</body>
</html>
