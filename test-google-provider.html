<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prueba Google Finance · CARTERA 20</title>
  <style>
    body{font-family:system-ui,sans-serif;background:#17212b;color:#e8eef5;padding:24px;max-width:700px;margin:auto}
    .card{background:#202d39;border-radius:16px;padding:20px;margin-top:16px}
    .label{color:#91a4b7;font-size:12px;letter-spacing:.08em}.value{font-size:34px;font-weight:700;margin-top:6px}.ok{color:#71d6a0}.muted{color:#91a4b7}
    textarea{width:100%;box-sizing:border-box;min-height:240px;margin-top:12px;padding:14px;border:1px solid #405363;border-radius:12px;background:#17212b;color:#e8eef5;font:14px monospace}
    button{margin-top:12px;padding:12px 18px;border:0;border-radius:10px;background:#71d6a0;color:#17212b;font-weight:700;font-size:15px}
    .audit{margin-top:14px;padding-top:14px;border-top:1px solid #405363;font-size:13px;line-height:1.7}
    .audit strong{color:#e8eef5}
  </style>
</head>
<body>
  <h1>Prueba Google Finance</h1>
  <p class="muted">CARTERA 20 · adaptador de datos</p>

  <div class="card">
    <div class="label">HISTÓRICO SPY</div>
    <p class="muted">Pegá las dos columnas de Google Sheets y probá el adaptador.</p>
    <textarea id="datos" placeholder="Fecha    Cierre"></textarea>
    <button id="probar" type="button">Probar adaptador</button>
  </div>

  <div class="card">
    <div class="label">RESULTADO</div>
    <div id="resultado" class="value">—</div>
    <p id="detalle" class="muted">Esperando datos.</p>
    <div id="auditoria" class="audit" hidden></div>
  </div>

  <script src="market-data.js?v=3"></script>
  <script>
    document.getElementById('probar').addEventListener('click', async () => {
      const texto = document.getElementById('datos').value;
      const proveedor = window.Cartera20MarketData.crearProveedorGoogleSheets({ SPY: texto });
      const quote = await proveedor.getQuote('SPY');
      const history = await proveedor.getHistory('SPY');
      const rsi = window.Cartera20MarketData.calcularRSI(history.data);

      const resultadoEl = document.getElementById('resultado');
      const detalleEl = document.getElementById('detalle');
      const auditoriaEl = document.getElementById('auditoria');

      if (!history.data.length) {
        resultadoEl.textContent = 'Sin datos';
        detalleEl.textContent = 'No se pudieron interpretar cierres.';
        auditoriaEl.hidden = true;
        return;
      }

      const primero = history.data[0];
      const ultimo = history.data[history.data.length - 1];

      resultadoEl.textContent = rsi.status === 'ok' ? rsi.value.toFixed(2) : 'Datos insuficientes';
      resultadoEl.className = `value ${rsi.status === 'ok' ? 'ok' : ''}`;
      detalleEl.textContent = `Proveedor: ${proveedor.name} · SPY: $${quote.price.toLocaleString('es-AR')} · ${history.data.length} cierres · ${rsi.status === 'ok' ? `${rsi.periods} variaciones` : 'se necesitan al menos 15 cierres'}`;

      auditoriaEl.hidden = false;
      auditoriaEl.innerHTML = `
        <div><strong>Primer dato:</strong> ${primero.date} · ${primero.close.toLocaleString('es-AR')}</div>
        <div><strong>Último dato:</strong> ${ultimo.date} · ${ultimo.close.toLocaleString('es-AR')}</div>
        <div><strong>Cierres recibidos:</strong> ${history.data.length}</div>
        <div><strong>Variaciones:</strong> ${Math.max(0, history.data.length - 1)}</div>
      `;
    });
  </script>
</body>
</html>
