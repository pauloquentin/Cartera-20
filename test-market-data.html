<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prueba RSI · CARTERA 20</title>
  <style>
    body{font-family:system-ui,sans-serif;background:#17212b;color:#e8eef5;padding:24px;max-width:700px;margin:auto}
    .card{background:#202d39;border-radius:16px;padding:20px;margin-top:16px}
    .label{color:#91a4b7;font-size:12px;letter-spacing:.08em}
    .value{font-size:32px;font-weight:700;margin-top:6px}
    .ok{color:#71d6a0}.muted{color:#91a4b7}
  </style>
</head>
<body>
  <h1>Prueba del motor RSI</h1>
  <p class="muted">CARTERA 20 · datos de prueba · sin conexión a mercado</p>

  <div class="card">
    <div class="label">RSI-14 · WILDER</div>
    <div id="resultado" class="value">Calculando…</div>
    <p id="detalle" class="muted"></p>
  </div>

  <script src="market-data.js"></script>
  <script>
    const cierres = [
      52375, 52325, 52375, 52500, 52600, 52450, 52700, 52850,
      52700, 52900, 53100, 53000, 53250, 53400, 53500, 53600
    ];

    const historicos = cierres.map((close, index) => ({
      date: `prueba-${index + 1}`,
      close
    }));

    const resultado = window.Cartera20MarketData.calcularRSI(historicos);
    const resultadoEl = document.getElementById('resultado');
    const detalleEl = document.getElementById('detalle');

    resultadoEl.textContent = resultado.value === null
      ? 'Sin datos suficientes'
      : resultado.value.toFixed(2);

    resultadoEl.classList.toggle('ok', resultado.status === 'ok');
    detalleEl.textContent = `Estado: ${resultado.status} · períodos: ${resultado.periods}`;
  </script>
</body>
</html>
