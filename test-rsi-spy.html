<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prueba RSI SPY · CARTERA 20</title>
  <style>
    body{font-family:system-ui,sans-serif;background:#17212b;color:#e8eef5;padding:24px;max-width:700px;margin:auto}
    .card{background:#202d39;border-radius:16px;padding:20px;margin-top:16px}
    .label{color:#91a4b7;font-size:12px;letter-spacing:.08em}
    textarea{width:100%;box-sizing:border-box;min-height:220px;margin-top:12px;padding:14px;border:1px solid #405363;border-radius:12px;background:#17212b;color:#e8eef5;font:14px monospace}
    button{margin-top:12px;padding:12px 18px;border:0;border-radius:10px;background:#71d6a0;color:#17212b;font-weight:700;font-size:15px}
    .value{font-size:36px;font-weight:700;margin-top:6px}.ok{color:#71d6a0}.muted{color:#91a4b7}
    .error{color:#ffb4a8}.small{font-size:13px;line-height:1.5}
  </style>
</head>
<body>
  <h1>Prueba RSI · SPY</h1>
  <p class="muted">CARTERA 20 · validación con datos reales de Google Finance</p>

  <div class="card">
    <div class="label">PEGAR DATOS DE GOOGLE SHEETS</div>
    <p class="small muted">Copiá las dos columnas de fecha y cierre de Google Finance y pegálas aquí. Se acepta tabulación, coma o punto y coma, con o sin encabezado.</p>
    <textarea id="datos" placeholder="Fecha    Cierre\n22/04/2026    52375\n23/04/2026    52325\n..."></textarea>
    <button id="calcular" type="button">Calcular RSI-14</button>
  </div>

  <div class="card">
    <div class="label">RSI-14 · WILDER</div>
    <div id="resultado" class="value">—</div>
    <p id="detalle" class="muted">Esperando datos.</p>
  </div>

  <script src="market-data.js"></script>
  <script>
    const datosEl = document.getElementById('datos');
    const resultadoEl = document.getElementById('resultado');
    const detalleEl = document.getElementById('detalle');

    function parsearDatos(texto) {
      return texto.split(/\r?\n/).map(linea => linea.trim()).filter(Boolean).map(linea => {
        const partes = linea.split(/\t|;|,/).map(p => p.trim());
        if (partes.length < 2) return null;
        const date = partes[0];
        let closeTexto = partes[partes.length - 1].replace(/\$/g,'').trim();
        if (closeTexto.includes('.') && closeTexto.includes(',')) {
          closeTexto = closeTexto.lastIndexOf(',') > closeTexto.lastIndexOf('.')
            ? closeTexto.replace(/\./g,'').replace(',','.')
            : closeTexto.replace(/,/g,'');
        } else if (closeTexto.includes(',')) {
          closeTexto = closeTexto.replace(',','.');
        }
        const close = Number(closeTexto);
        return Number.isFinite(close) && close > 0 ? {date, close} : null;
      }).filter(Boolean);
    }

    document.getElementById('calcular').addEventListener('click', () => {
      const historicos = parsearDatos(datosEl.value);
      const resultado = window.Cartera20MarketData.calcularRSI(historicos);

      if (resultado.status !== 'ok') {
        resultadoEl.textContent = '—';
        resultadoEl.className = 'value error';
        detalleEl.textContent = `Datos válidos: ${historicos.length}. Se necesitan al menos 15 cierres.`;
        return;
      }

      resultadoEl.textContent = resultado.value.toFixed(2);
      resultadoEl.className = 'value ok';
      detalleEl.textContent = `Estado: OK · ${resultado.periods} variaciones · último dato: ${resultado.date}`;
    });
  </script>
</body>
</html>
